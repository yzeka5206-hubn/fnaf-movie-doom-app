name: Build and verify 60 FPS offline updater

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout updater sources without game LFS downloads
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check PCH2 safety and both exact source/target headers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patch-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/patch-classes" \
            doom/repair/java/com/fnaf/moviedoom/repair/PatchEngine.java doom/repair/tests/Test.java
          java -cp "$RUNNER_TEMP/patch-classes" com.fnaf.moviedoom.repair.Test
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          root=Path('doom/repair/assets')
          target='3ae61eee3afd2fd1b55c73cefff22d5c540a000d4961d04e35ee0edbb48c1fe5'
          variants={
            'repair-v13.dat':('f55c97179051b1ae5b36a255baa79d4c33e03c51ae0c15b4b0628f7a68ff9286','1040ce49eec462137c62579155c709e304fd6dbee4b152a49172189d53d56609'),
            'repair-v14.dat':('becb43039e405b619dc39c8b2d00e5d0ffe991fac1a6bc6e2edba837371b8879','002cb5668de506f9e64723a3792adbfa6c444c578715f71033d52d9197bf31bf'),
          }
          for name,(source,patch_sha) in variants.items():
              data=(root/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==patch_sha, name
              assert data[:8]==b'FNAFPCH2' and data[24:56].hex()==source and data[56:88].hex()==target, name
              count=struct.unpack('>I',data[88:92])[0]
              assert 0<count<=16384, (name,count)
              print('PASS',name,'whole patch SHA, source SHA, target SHA,',count,'operations')
          PY
      - name: Preflight pinned Gradle distribution
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle download attempt $attempt failed" >&2
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Build offline updater
        run: |
          chmod +x ./gradlew
          ./gradlew :doom:assembleDebug --no-daemon
      - name: Verify updater package, permissions, and signature
        run: |
          set -euo pipefail
          APK=doom/build/outputs/apk/debug/FNAF-FPS60-Guncelleyici.apk
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep '^package: name=' "$RUNNER_TEMP/badging.txt" | grep "com.fnaf.moviedoom.fpsupdater"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump permissions "$APK" > "$RUNNER_TEMP/permissions.txt"
          if grep -Fq 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected network permission'; exit 1
          fi
          echo 'PASS unique updater package and no INTERNET permission'
      - name: Upload candidate used for both Android tests
        uses: actions/upload-artifact@v4
        with:
          name: FNAF-FPS60-Helper-Candidate
          path: doom/build/outputs/apk/debug/FNAF-FPS60-Guncelleyici.apk
          if-no-files-found: error
          retention-days: 90

  android_test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        baseline: [13, 14]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout test script
        uses: actions/checkout@v4
      - name: Install Android SDK build tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Download same candidate
        uses: actions/download-artifact@v4
        with:
          name: FNAF-FPS60-Helper-Candidate
          path: helper
      - name: Android 14 real APK v${{ matrix.baseline }} in-place update
        run: bash scripts/android14-animation-updater-ci.sh "$PWD/helper/FNAF-FPS60-Guncelleyici.apk" '${{ matrix.baseline }}'

  publish:
    needs: [build, android_test]
    runs-on: ubuntu-latest
    steps:
      - name: Download twice-tested helper
        uses: actions/download-artifact@v4
        with:
          name: FNAF-FPS60-Helper-Candidate
          path: helper
      - name: Upload verified updater APK
        uses: actions/upload-artifact@v4
        with:
          name: FNAF-FPS60-Guncelleyici
          path: helper/FNAF-FPS60-Guncelleyici.apk
          if-no-files-found: error
          retention-days: 90
