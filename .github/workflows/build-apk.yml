name: Build and test offline optimization updater

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  updater:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout updater sources (game LFS files not required)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Check patch safety and exact source and target headers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patch-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/patch-classes" \
            doom/repair/java/com/fnaf/moviedoom/repair/PatchEngine.java doom/repair/tests/Test.java
          java -cp "$RUNNER_TEMP/patch-classes" com.fnaf.moviedoom.repair.Test
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          root=Path('doom/repair/assets')
          target='5047ab19722faa809649251d5eb3e3b0f7705294db4e9d535f8cc28180ff9e7c'
          variants={
            'repair-optimized.dat':('6872aa42e59cfd66bfceae35cd1c289382f533dd2b91d57ce0d8bf91e7a256a4','91ce6be4bb67e90425899c7db3e874e498cfcad88032e0e931621028598875ed'),
          }
          for name,(source,patch_sha) in variants.items():
              data=(root/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==patch_sha, name
              assert data[:8]==b'FNAFPCH2' and data[24:56].hex()==source and data[56:88].hex()==target, name
              count=struct.unpack('>I',data[88:92])[0]
              assert 0<count<=16384, (name,count)
              print('PASS',name,'whole patch SHA, source SHA, target SHA,',count,'operations')
          PY

      - name: Build offline updater
        run: |
          chmod +x ./gradlew
          ./gradlew :doom:assembleDebug --no-daemon

      - name: Verify updater package, permissions, and signature
        run: |
          set -euo pipefail
          APK=doom/build/outputs/apk/debug/FNAF-Optimize-Guncelleyici.apk
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package: name=' | grep "com.fnaf.moviedoom.optimizeupdater"
          if "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected network permission'; exit 1
          fi
          echo 'PASS unique updater package and no INTERNET permission'

      - name: Android 14 real-APK preparation and side-by-side installation
        run: bash scripts/android14-animation-updater-ci.sh "$PWD/doom/build/outputs/apk/debug/FNAF-Optimize-Guncelleyici.apk"

      - name: Upload verified updater APK
        uses: actions/upload-artifact@v4
        with:
          name: FNAF-Optimize-Guncelleyici
          path: doom/build/outputs/apk/debug/FNAF-Optimize-Guncelleyici.apk
          if-no-files-found: error
          retention-days: 14
